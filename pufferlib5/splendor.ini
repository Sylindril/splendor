[base]
env_name = splendor

# Seats > 0 play a frozen checkpoint from this run's pool.
[selfplay]
enabled = 1
max_size = 16

# total_agents must divide by the compiled seat count: 8192 works for 2 and 4
# seats, use 8190 for -DSPLENDOR_PLAYERS=3.
[vec]
total_agents = 8192
num_policies = 2
hist_policy_percent = 0.5
hist_policy_hidden_size = 512
hist_policy_num_layers = 2
num_threads = 8

[env]
# 0 = 60 turns per seat.
max_turns = 0
reward_point = 0.02
reward_card = 0.0
reward_win = 1.0
reward_loss = -1.0
# Scripted opponent for seats > 0: 0 = none, 1 = random legal, 2 = greedy.
bot_policy = 0

[policy]
hidden_size = 512
num_layers = 2

# Untuned: these are defaults plus a longer budget and a shorter horizon
# (one Splendor game is ~120 steps per seat). Sweep before trusting them.
[train]
total_timesteps = 1_000_000_000
horizon = 32
minibatch_size = 32768
gamma = 0.995
gae_lambda = 0.9
