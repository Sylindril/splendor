[base]
package = splendor
env_name = puffer_splendor
env_class = League
policy_name = Big
rnn_name = None

[env]
num_envs = 512
num_players = 2
latest_frac = 0.5
pool_dir = experiments/pool
latest_path = experiments/latest.pt

[vec]
backend = Multiprocessing
num_envs = 8
num_workers = 8
batch_size = 4

[league]
save_every = 30
pool_every = 20_000_000

[train]
total_timesteps = 1_000_000_000
bptt_horizon = 16
minibatch_size = 32768
device = auto
