/* ================================================================== */
/*  ANIMATION                                                         */
/*  The new state is always rendered first; everything below is a      */
/*  throwaway clone flying over the top of it in the #fx layer, so an  */
/*  interrupted animation can never leave the board inconsistent.      */
/* ================================================================== */
function rectOf(node){
  if(!node || typeof node.getBoundingClientRect !== 'function') return null;
  const r = node.getBoundingClientRect();
  if(!r || !r.width || !r.height) return null;
  return {x:r.left, y:r.top, w:r.width, h:r.height};
}
function snapRects(){
  const m = {};
  if(typeof document.querySelectorAll !== 'function') return m;
  const all = document.querySelectorAll('[data-fx]');
  for(let i=0;i<all.length;i++){
    const r = rectOf(all[i]);
    if(r) m[all[i].getAttribute('data-fx')] = r;
  }
  return m;
}
function drop(node){ if(node && typeof node.remove === 'function') node.remove(); }
function wait(ms){ return new Promise(r=> setTimeout(r, ms)); }

function fly(node, from, to, o){
  o = o || {};
  const layer = $('fx');
  if(REDUCE || !node || !from || !to || !layer || typeof layer.appendChild !== 'function')
    return Promise.resolve();
  if(node.style){
    node.style.position = 'fixed';
    node.style.left = from.x + 'px'; node.style.top = from.y + 'px';
    node.style.width = from.w + 'px'; node.style.height = from.h + 'px';
    node.style.margin = '0'; node.style.pointerEvents = 'none';
  }
  layer.appendChild(node);
  if(typeof node.animate !== 'function'){ drop(node); return Promise.resolve(); }
  const dx = (to.x + to.w/2) - (from.x + from.w/2);
  const dy = (to.y + to.h/2) - (from.y + from.h/2);
  const sc = Math.max(.25, Math.min(1.25, (o.scaleTo || to.w) / (from.w || 1)));
  const lift = o.lift===undefined ? -Math.min(60, Math.abs(dx)*.18 + 22) : o.lift;
  const mid = {transform:'translate('+(dx*.5).toFixed(1)+'px,'+(dy*.5+lift).toFixed(1)
      + 'px) scale('+((1+sc)/2*1.08).toFixed(3)+') rotate('+(o.spin||0)/2+'deg)',
    opacity:1, offset:.55};
  let a;
  try{
    a = node.animate([
      {transform:'translate(0,0) scale(1) rotate(0deg)', opacity: o.fadeIn ? 0 : 1},
      mid,
      {transform:'translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px) scale('+sc.toFixed(3)
        + ') rotate('+(o.spin||0)+'deg)', opacity: o.keep ? 1 : .05}
    ], {duration:o.d||560, delay:o.delay||0, fill:'forwards',
        easing:'cubic-bezier(.34,.72,.3,1)'});
  }catch(e){ drop(node); return Promise.resolve(); }
  /* A throttled view (another tab, an occluded window) may never settle
     `finished`; always race it against the wall clock so the queue -- and with
     it the poll loop -- can never wedge. */
  const budget = (o.d||560) + (o.delay||0) + 300;
  const done = Promise.race([
    Promise.resolve(a.finished).catch(()=>{}),
    new Promise(r=> setTimeout(r, budget))
  ]);
  return done.then(()=>{ drop(node); }, ()=>{ drop(node); });
}

function flyChip(color, from, to, o){
  const c = chip(color, undefined, 'flyc');
  if(c.style){ c.style.setProperty('--csz', ((from && from.w) || 26) + 'px'); }
  return fly(c, from, to, o);
}
function flyCard(card, tier, from, to, o){
  const holder = el('div','slot flyc');
  const cd = cardEl(card, tier);
  if(cd.style) cd.style.position = 'absolute';
  holder.appendChild(cd);
  return fly(holder, from, to, o);
}
function flyNobleTile(req, from, to, o){
  const n = nobleEl(req || [0,0,0,0,0]);
  n.classList.add('flyc');
  return fly(n, from, to, o);
}
function bump(seat){
  const m = q('mat:'+seat);
  if(!m || !m.classList) return Promise.resolve();
  m.classList.add('bump');
  return wait(380).then(()=>{ if(m.classList) m.classList.remove('bump'); });
}

/* the replacement card flips in: a back slides from the deck, then the face turns up */
function revealSlot(slot, B, A, k){
  const tier = Math.floor(slot/4);
  const to = A['slot:'+slot], from = B['deck:'+tier] || A['deck:'+tier] || to;
  const node = q('slot:'+slot);
  const tag = ()=> {
    if(!node || typeof node.appendChild !== 'function') return;
    if(node.classList) node.classList.add('fresh');
    const t = el('div','newtag','NEW');
    node.appendChild(t);
    setTimeout(()=>{ if(t.classList) t.classList.add('out'); }, 1500);
    setTimeout(()=>{ drop(t); if(node.classList) node.classList.remove('fresh'); }, 2100);
  };
  if(REDUCE || !to){ tag(); return Promise.resolve(); }
  const half = 260*k;
  const back = el('div','slot flyc');
  const bc = backEl(tier);                 /* the card being dealt, not a reserve */
  if(bc.style) bc.style.position='absolute';
  back.appendChild(bc);
  /* half 1: the back slides out of the deck and turns edge-on */
  const p1 = fly(back, from, to, {d:half, spin:0, lift:-14, keep:true, scaleTo:to.w});
  return p1.then(()=>{
    /* half 2: the real card, already rendered underneath, completes the turn */
    if(node && typeof node.animate === 'function'){
      try{
        node.animate([
          {transform:'perspective(700px) rotateY(-88deg)', opacity:.35},
          {transform:'perspective(700px) rotateY(0deg)', opacity:1}
        ], {duration:half, easing:'cubic-bezier(.3,.8,.35,1)'});
      }catch(e){}
    }
    tag();
    return wait(half);
  });
}

function playEvent(e, B, A, k){
  const seat = e.seat, mat = A['mat:'+seat] || B['mat:'+seat];
  const jobs = [];
  if(e.type === 'take' || e.type === 'take2'){
    (e.gems||[]).forEach((c,i)=>{
      const to = A['tok:'+seat+':'+c] || mat;
      jobs.push(flyChip(c, B['bank:'+c] || A['bank:'+c], to,
                        {d:500*k, delay:i*110*k, spin:180}));
    });
  } else if(e.type === 'discard'){
    jobs.push(flyChip(e.color, B['tok:'+seat+':'+e.color] || mat,
                      A['bank:'+e.color], {d:460*k, spin:-140}));
  } else if(e.type === 'buy'){
    const src = e.from.kind === 'faceup' ? 'slot:'+e.from.slot
                                         : 'res:'+seat+':'+e.from.idx;
    const dst = (e.card && A['stack:'+seat+':'+e.card.bonus]) || mat;
    const tier = e.from.kind === 'faceup' ? Math.floor(e.from.slot/4) : undefined;
    jobs.push(flyCard(e.card, tier, B[src] || mat, dst, {d:620*k, spin:6}));
    (e.paid||[]).forEach((n,c)=>{
      for(let i=0;i<n;i++)
        jobs.push(flyChip(c, B['tok:'+seat+':'+c] || mat, A['bank:'+c],
                          {d:480*k, delay:(40*c + 70*i)*k, spin:-150}));
    });
    if(e.from.kind === 'faceup') jobs.push(revealSlot(e.from.slot, B, A, k));
    if(e.noble) jobs.push(flyNobleTile(e.noble.req, B['noble:'+e.noble.slot],
                                       A['nobox:'+seat] || mat, {d:640*k, delay:220*k}));
  } else if(e.type === 'reserve'){
    const deck = e.from.kind === 'deck';
    const tier = deck ? e.from.tier : Math.floor(e.from.slot/4);
    const src = deck ? 'deck:'+tier : 'slot:'+e.from.slot;
    const dst = A['res:'+seat+':'+e.to_slot] || A['resbox:'+seat] || mat;
    /* a deck reserve the viewer may not see flies as a face-down back */
    jobs.push(flyCard(e.card || {hidden:true}, tier, B[src] || mat, dst, {d:620*k, spin:-6}));
    if(e.gold) jobs.push(flyChip(5, B['bank:5'] || A['bank:5'],
                                 A['tok:'+seat+':5'] || mat, {d:500*k, delay:150*k, spin:180}));
    if(!deck) jobs.push(revealSlot(e.from.slot, B, A, k));
  } else if(e.type === 'noble'){
    jobs.push(flyNobleTile(e.req, B['noble:'+e.slot], A['nobox:'+seat] || mat, {d:640*k}));
  } else {
    jobs.push(bump(seat));
  }
  return Promise.all(jobs);
}

function queueEvents(before){
  const evs = (S.events || []).filter(e => e.id > lastEventId);
  if(!evs.length) return;
  lastEventId = evs[evs.length-1].id;
  /* the winning move animates too: the env now HOLDS the finished board, so the
     clones land on the same table the results panel describes */
  if(REDUCE) return;
  const after = snapRects();
  const k = evs.length > 3 ? .5 : evs.length > 1 ? .72 : 1;
  animating++; animSince = Date.now();
  animQ = animQ.then(()=>{
    let chain = Promise.resolve();
    evs.forEach(e=>{
      chain = chain.then(()=> playEvent(e, before, after, k))
                   .then(()=> wait(60*k), err=>{ console.warn(err); });
    });
    return chain;
  }).then(()=>{ animating--; }, ()=>{ animating--; });
  return animQ;
}

/* the one entry point that both renders a new state and animates into it */
function apply(st){
  const before = snapRects();
  render(st);
  queueEvents(before);
}

/* ================================================================== */
/*  TABLE PICKER (unchanged contract)                                  */
/* ================================================================== */
function fmtSteps(n){
  if(n>=1e6) return (n/1e6).toFixed(n>=1e8?0:1)+'M';
  if(n>=1e3) return Math.round(n/1e3)+'k';
  return String(n);
}
function ckLabel(c){
  const m = /step_0*(\d+)\.pt$/.exec(c.label);
  return m ? c.label + '  ·  ' + fmtSteps(+m[1]) + ' steps' : c.label;
}
function isBot(sp){ return sp==='random' || sp==='greedy'; }
/* bots and PufferLib 5.0 weight files cannot be wrapped in MCTS search */
function noSearch(sp){ return isBot(sp) || sp.indexOf('puffer5:')===0; }
function specParse(spec){
  if(!spec) return {spec:'random', search:false, sims:64};
  if(spec.indexOf('mcts:')!==0) return {spec:spec, search:false, sims:64};
  const rest = spec.slice(5), m = /^(.*):(\d+)$/.exec(rest);
  return m ? {spec:m[1], search:true, sims:+m[2]} : {spec:rest, search:true, sims:64};
}
function specJoin(s){
  if(noSearch(s.spec) || !s.search) return s.spec;
  return 'mcts:' + s.spec + ':' + Math.max(1, Math.min(100000, s.sims|0));
}
function specLabel(spec){
  const p = specParse(spec);
  if(isBot(p.spec)) return p.spec;
  const ck = OPT && OPT.checkpoints.filter(c=>c.path===p.spec)[0];
  const name = ck ? ck.label : p.spec.split('/').pop();
  return p.search ? name + ' · MCTS ' + p.sims : name;
}
function validSpec(sp, P){
  if(isBot(sp)) return true;
  return !!(OPT && OPT.checkpoints.some(c=>c.path===sp && c.num_players===P));
}
function cfgFromServer(){
  const cur = (OPT && OPT.current) || {num_players:(S?S.num_players:2),
    human:(S?S.human:0), seats:(S&&S.seats)||[], sample:!!(S&&S.sample)};
  const out = {num_players:cur.num_players, human:cur.human, sample:!!cur.sample, seats:[]};
  for(let i=0;i<out.num_players;i++) out.seats.push(specParse(cur.seats[i]));
  return out;
}
function fixSeats(){
  const P = CFG.num_players;
  while(CFG.seats.length < P) CFG.seats.push({spec:'random', search:false, sims:64});
  CFG.seats.length = P;
  if(CFG.human!==null && CFG.human>=P) CFG.human = P-1;
  CFG.seats.forEach(s=>{ if(!validSpec(s.spec,P)){ s.spec='random'; s.search=false; } });
}
function seatRow(i){
  const s = CFG.seats[i], mine = CFG.human===i;
  const row = el('div','seatrow'+(mine?' me':''));
  const who = el('div','seat');
  who.appendChild(el('div','av', String(i)));
  who.appendChild(el('span',null, mine ? 'you' : 'seat '+i));
  row.appendChild(who);
  if(mine){ row.appendChild(el('span','hint','you play this seat')); return row; }
  const dd = el('select');
  OPT.bots.forEach(b=>{ const o=el('option'); o.value=b; o.textContent=b;
    if(s.spec===b) o.selected=true; dd.appendChild(o); });
  OPT.checkpoints.filter(c=>c.num_players===CFG.num_players).forEach(c=>{
    const o=el('option'); o.value=c.path; o.textContent=ckLabel(c);
    if(s.spec===c.path) o.selected=true; dd.appendChild(o); });
  dd.value = s.spec;
  dd.title = s.spec;
  dd.onchange = ()=>{ s.spec = dd.value; if(noSearch(s.spec)) s.search=false;
                      cfgErr=''; renderSetup(); };
  row.appendChild(dd);
  const ck = !noSearch(s.spec);
  const lab = el('label','switch'); lab.title = 'play this seat with MCTS search';
  const cb = el('input'); cb.type='checkbox'; cb.checked = ck && s.search; cb.disabled = !ck;
  cb.onchange = ()=>{ s.search = !!cb.checked; cfgErr=''; renderSetup(); };
  lab.appendChild(cb); lab.appendChild(el('span',null,'search'));
  row.appendChild(lab);
  const box = el('div','simbox');
  const num = el('input'); num.type='number'; num.min='1'; num.max='4000'; num.step='16';
  num.value = String(s.sims); num.disabled = !(ck && s.search);
  num.oninput = ()=>{ s.sims = Math.max(1, Math.min(100000, parseInt(num.value,10)||64)); };
  box.appendChild(num); box.appendChild(el('span',null,'sims'));
  row.appendChild(box);
  return row;
}
function renderSetup(){
  const b = $('setupBody'); b.innerHTML='';
  $('setupErr').textContent = cfgErr;
  $('dealBtn').disabled = cfgBusy || !OPT;
  $('setupNote').textContent = cfgBusy ? 'dealing…' : '';
  if(!OPT || !CFG){ b.appendChild(el('span','hint','Loading agents…')); return; }

  let r = el('div','frow'); r.appendChild(el('span','flab','players'));
  const seg = el('div','seg');
  [2,3,4].forEach(n=>{
    const btn = el('button', n===CFG.num_players?'on':'', String(n));
    btn.onclick = ()=>{ CFG.num_players=n; fixSeats(); cfgErr=''; renderSetup(); };
    seg.appendChild(btn);
  });
  r.appendChild(seg); b.appendChild(r);

  r = el('div','frow'); r.appendChild(el('span','flab','your seat'));
  const mine = el('div','seg');
  const w = el('button', CFG.human===null?'on':'', 'watch');
  w.onclick = ()=>{ CFG.human=null; fixSeats(); cfgErr=''; renderSetup(); };
  mine.appendChild(w);
  for(let i=0;i<CFG.num_players;i++){
    const btn = el('button', CFG.human===i?'on':'', 'seat '+i);
    btn.onclick = ()=>{ CFG.human=i; fixSeats(); cfgErr=''; renderSetup(); };
    mine.appendChild(btn);
  }
  r.appendChild(mine); b.appendChild(r);

  const seats = el('div');
  for(let i=0;i<CFG.num_players;i++) seats.appendChild(seatRow(i));
  b.appendChild(seats);

  r = el('div','frow'); r.appendChild(el('span','flab','moves'));
  const lab = el('label','badge switch');
  const cb = el('input'); cb.type='checkbox'; cb.checked = !!CFG.sample;
  cb.onchange = ()=>{ CFG.sample = !!cb.checked; };
  lab.appendChild(cb); lab.appendChild(el('span',null,'sample moves'));
  r.appendChild(lab);
  r.appendChild(el('span','hint','policy seats sample instead of playing the argmax'));
  b.appendChild(r);
}
async function loadOptions(){
  try{
    const r = await fetch('/options');
    OPT = await r.json();
  }catch(e){ cfgErr = 'could not reach /options — restart the GUI server'; }
}
async function openSetup(){
  $('setup').hidden = false;
  cfgErr = '';
  if(OPT){ CFG = cfgFromServer(); fixSeats(); }
  renderSetup();
  await loadOptions();
  CFG = cfgFromServer(); fixSeats();
  renderSetup();
}
function closeSetup(){ $('setup').hidden = true; }

async function dealTable(){
  if(cfgBusy || !CFG) return;
  const body = {num_players: CFG.num_players, human: CFG.human, sample: !!CFG.sample,
    seats: CFG.seats.map((s,i)=> i===CFG.human ? null : specJoin(s))};
  cfgBusy = true; busy = true; cfgErr = ''; renderSetup();
  try{
    const r = await fetch('/config', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const j = await r.json();
    if(!j || j.error){ cfgErr = (j && j.error) || 'the table was refused'; return; }
    if(OPT) OPT.current = {num_players:body.num_players, human:body.human,
                           seats:body.seats, sample:body.sample};
    logLines=[]; lastLogged=null; sel=[]; selCard=null; cursor=null;
    resultsHidden=false; lastEventId = (j.event_id|0);
    closeSetup();
    render(j);
  }catch(e){ cfgErr = String(e && e.message || e); }
  finally{ cfgBusy = false; busy = false; renderSetup(); }
}

/* ================================================================== */
/*  INTERACTION                                                        */
/* ================================================================== */
function clickGem(c){
  selCard = null; note = '';
  const i = sel.indexOf(c);
  if(sel.length===1 && sel[0]===c){                    /* second click = take 2 same */
    if(canAdd(c)) sel = [c,c];
    else note = 'Taking 2 ' + colorName(c) + ' needs at least 4 in the bank (there are '
                + S.bank[c] + '). Click again to deselect.';
    if(!canAdd(c) && sel._warned===c){ sel = []; note=''; }
    else if(!canAdd(c)) sel._warned = c;
  }
  else if(i>=0) sel.splice(i,1);
  else if(sel.length<3 && canAdd(c)) sel.push(c);
  else if(sel.length<3) note = 'Cannot add ' + colorName(c) + ' to this take.';
  render(S);
}
function pickCard(c){ sel=[]; selCard=c; cursor = cellOf(c) || cursor; render(S); }
function newGame(){
  logLines=[]; lastLogged=null; lastEventId=-1;
  sel=[]; selCard=null; cursor=null; note=''; resultsHidden=false;
  post('/reset');
}
/* Escape: drop every transient selection, and close whatever is open */
function escapeAll(){
  if(legendOpen){ legendOpen = false; renderLegend(); }
  if(!$('setup').hidden) closeSetup();
  if(S && S.over && !resultsHidden) resultsHidden = true;
  sel = []; selCard = null; cursor = null; note = '';
  if(S) render(S);
}

async function post(path, body){
  if(busy) return; busy = true;
  try{
    const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'},
                                body: JSON.stringify(body||{})});
    const j = await r.json();
    if(j.error){ console.warn(j.error); return; }
    sel=[]; selCard=null; note=''; apply(j);
  } finally { busy = false; }
}
function send(a){ if(a===null || !S.mask[a]) return; post('/act', {action:a}); }

/* ================================================================== */
/*  KEYBOARD                                                           */
/*  Every key goes through the same helpers the mouse uses (clickGem,   */
/*  cardActions, send), so a key can never fire an action the mask      */
/*  forbids -- send() drops anything the mask does not allow.           */
/* ================================================================== */
function typingSomewhere(){
  const a = document.activeElement;
  if(!a || !a.tagName) return false;
  const t = String(a.tagName).toUpperCase();
  return t==='INPUT' || t==='SELECT' || t==='TEXTAREA' || a.isContentEditable===true;
}
function stop(e){ if(e && typeof e.preventDefault === 'function') e.preventDefault(); }
function keyCard(which){                       /* B / R on the focused card */
  const c = activeCard();
  if(!c) return false;
  const a = which==='buy' ? cardActions(c).buy : cardActions(c).res;
  if(!legalAction(a)) return false;
  send(a);
  return true;
}
function moveCursorBy(dx, dy){
  if(!cursor){ moveCursor({row:2, col:1}); return; }   /* home: tier 1, first card */
  let row = cursor.row, col = cursor.col;
  if(dx){ const n = rowCols(row); col = (col + dx + n) % n; }
  if(dy){ row = (row + dy + CUR_ROWS) % CUR_ROWS; col = Math.min(col, rowCols(row)-1); }
  moveCursor({row:row, col:col});
}
function onKey(e){
  if(!e) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if(k==='Escape'){ stop(e); escapeAll(); return; }
  if(typingSomewhere()) return;
  if(!$('setup').hidden) return;              /* the picker owns the keyboard */
  if(k==='?'){ stop(e); legendOpen = !legendOpen; renderLegend(); return; }
  if(!S) return;
  const low = (typeof k==='string' && k.length===1) ? k.toLowerCase() : k;
  const A = S.actions;
  if(low==='n'){ stop(e); newGame(); return; }
  if(low==='t'){ stop(e); openSetup(); return; }
  if(k===' ' || k==='Spacebar'){
    stop(e);
    if(S.human===null && !S.over && !busy) post('/step');
    return;
  }
  if(k==='ArrowLeft' || k==='ArrowRight'){ stop(e); moveCursorBy(k==='ArrowRight'?1:-1,0); return; }
  if(k==='ArrowUp'   || k==='ArrowDown' ){ stop(e); moveCursorBy(0, k==='ArrowDown'?1:-1); return; }
  if(S.over) return;                          /* nothing on the board is actionable */
  if(k>='1' && k<='6'){
    stop(e);
    const i = (+k) - 1;
    if(!isMyTurn()) return;
    if(S.phase==='discard'){ send(A.DISCARD + i); return; }
    if(S.phase==='noble'){ if(i<5) send(A.CHOOSE_NOBLE + i); return; }
    if(i<5) clickGem(i);                      /* gold is never takeable */
    return;
  }
  if(k==='Enter'){                            /* Enter only confirms a gem take */
    stop(e);
    if(sel.length){ const a = takeAction(); if(legalAction(a)) send(a); }
    return;
  }
  if(low==='b'){ stop(e); keyCard('buy'); return; }
  if(low==='r'){ stop(e); keyCard('res'); return; }
  if(low==='p'){
    stop(e);
    if(S.mask[A.PASS] && S.mask.reduce((n,v)=>n+v,0)===1) send(A.PASS);
    return;
  }
}

$('tableBtn').onclick = ()=>openSetup();
$('setupClose').onclick = ()=>closeSetup();
$('dealBtn').onclick = ()=>dealTable();
$('setup').onclick = (e)=>{ if(e && e.target===$('setup')) closeSetup(); };
document.onkeydown = onKey;
$('stepBtn').onclick = ()=>post('/step');
$('resetBtn').onclick = ()=>newGame();
$('speed').oninput = ()=> $('speedLbl').textContent = $('speed').value + ' ms';
$('logToggle').onclick = ()=>{ logOpen = !logOpen; renderLog(); fitBoard(); };
if(typeof addEventListener === 'function') addEventListener('resize', fitBoard);

/* ---------- the poll loop waits for the animations to finish ---------- */
let timer = null;
function tick(){
  /* a finished game never polls: the held board is the whole point */
  if(S && S.over && $('auto').checked) $('auto').checked = false;
  const on = $('auto').checked;
  const need = S && !S.over && (S.human===null ? on : S.acting!==S.human);
  if(animating > 0 && Date.now()-animSince > 8000){   /* watchdog */
    animating = 0; animQ = Promise.resolve();
  }
  if(need && !busy && animating===0) post('/step');
  timer = setTimeout(tick, Math.max(60, +$('speed').value));
}
(async function(){
  buildDefs();
  const st = await (await fetch('/state')).json();
  lastEventId = st.event_id | 0;            /* never replay the backlog on a reload */
  render(st);
  loadOptions();
  tick();
})();
</script>
